# Serves one mini project's build; reached only through the shell's /remotes/<id>/ proxy.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Stable name, so it must be revalidated to pick up new deploys.
    location = /remoteEntry.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
