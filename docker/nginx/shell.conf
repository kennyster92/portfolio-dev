# Public entry point: serves the shell and proxies each mini project from its container.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS, resolved per request so remotes can be added or
    # restarted without reloading the shell.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /remotes/<id>/... -> http://mfe-<id>/... (compose service named mfe-<id>)
    location ~ ^/remotes/([a-z0-9-]+)/(.*)$ {
        set $upstream http://mfe-$1:80/$2$is_args$args;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    # Hashed build output never changes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback so deep links like /projects/task-board work.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
