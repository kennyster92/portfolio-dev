# Whole system: the shell (public gateway) plus one container per mini project.
#   docker compose up -d --build   ->  http://localhost:8080

x-remote: &remote
  build: &remote-build
    context: .
    dockerfile: docker/Dockerfile
    args:
      NGINX_CONF: remote.conf
  restart: unless-stopped

services:
  shell:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP: apps/shell
        NGINX_CONF: shell.conf
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

  # One service per mini project. The service MUST be named mfe-<id>, where <id>
  # is the project folder and its id in apps/shell/src/projects/registry.ts.
  # Remotes are not published on the host; the shell proxies /remotes/<id>/.

  mfe-scatter-plot:
    <<: *remote
    build:
      <<: *remote-build
      args: { APP: projects/scatter-plot, NGINX_CONF: remote.conf }

  mfe-component-library:
    <<: *remote
    build:
      <<: *remote-build
      args: { APP: projects/component-library, NGINX_CONF: remote.conf }

  mfe-task-board:
    <<: *remote
    build:
      <<: *remote-build
      args: { APP: projects/task-board, NGINX_CONF: remote.conf }

  mfe-api-explorer:
    <<: *remote
    build:
      <<: *remote-build
      args: { APP: projects/api-explorer, NGINX_CONF: remote.conf }

  mfe-search-catalogue:
    <<: *remote
    build:
      <<: *remote-build
      args: { APP: projects/search-catalogue, NGINX_CONF: remote.conf }

  mfe-admin-auth:
    <<: *remote
    build:
      <<: *remote-build
      args: { APP: projects/admin-auth, NGINX_CONF: remote.conf }
